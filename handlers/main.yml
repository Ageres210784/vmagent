---
- name: Check configuration
  ansible.builtin.shell: "{{ vmagent_check_command }}"
  register: result
  retries: 3
  delay: 3
  until: result is not failed

- name: Reload vmagent
  ansible.builtin.uri:
    url: "{{ vmagent_reload_url }}"
    method: POST
  register: reload_result
  until: reload_result is succeeded
  retries: 3
  delay: 3
